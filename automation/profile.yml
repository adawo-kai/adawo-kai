# Redraws the profile on a schedule: the room, the mountains, the numbers, the snake.
# To switch it on, move this file to .github/workflows/profile.yml and push
# (the push needs a token with the "workflow" scope:  gh auth refresh -h github.com -s workflow).
name: profile

on:
  schedule:
    - cron: "17 * * * *"        # every hour, off the top of the hour, where scheduled runs queue up
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md scripts/data.json
          git diff --cached --quiet || git commit -m "Redraw the profile"
          git push
